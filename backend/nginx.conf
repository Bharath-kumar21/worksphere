# Nginx Reverse Proxy and HTTPS Configuration for Team Collaboration SaaS
# Path: /etc/nginx/sites-available/team_collab

upstream flask_app {
    server 127.0.0.1:5000 fail_timeout=0;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name collab.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name collab.yourdomain.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/collab.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collab.yourdomain.com/privkey.pem;

    # Security Headers & SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file upload size (matching backend 16MB)
    client_max_body_size 16M;

    # Serve Built Frontend Static Files
    location / {
        root /var/www/team_collab/frontend_dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Flask Gunicorn
    location /api/ {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Static File Uploads Proxy
    location /uploads/ {
        alias /var/www/team_collab/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
